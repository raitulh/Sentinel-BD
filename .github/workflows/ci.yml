name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests scripts migrations
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci_migration.sqlite
          APP_ENV: development
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          BOOTSTRAP_TOKEN: ci-only-bootstrap-token-0123456789
          MEDIA_ROOT: ./ci-media
        run: alembic upgrade head && alembic check
      - run: PYTHONPATH=. pytest -vv -x --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
